[pytest]
# Put the repo root on sys.path so `import app` works no matter which directory
# pytest is invoked from. Without this, pytest inserts tests/ (the test file's
# own directory) and the imports fail.
pythonpath = .
testpaths = tests
# -q: the summary matters, the dots do not. --strict-markers: a typo'd
# @pytest.mark.slwo becomes an error instead of a silently ignored decorator.
addopts = -q --strict-markers
markers =
    integration: needs a live Postgres with the manual ingested (deselect with -m "not integration")
